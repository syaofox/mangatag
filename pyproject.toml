[project]
name = "mangatag"
version = "1.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "itsdangerous",
    "jinja2",
    "lxml",
    "opencc-python-reimplemented",
    "pypinyin",
    "python-multipart",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1", "ruff>=0.6"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "RUF100"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
disable_error_code = ["arg-type", "assignment"]
